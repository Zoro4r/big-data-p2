# Entorno completo del proyecto: MongoDB, Cassandra, Neo4j y Airflow.
# Uso: cp .env.example .env && docker compose up -d --build
# Los límites de memoria están pensados para correr en un equipo con ~4 GB para Docker.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # En local el DAG arranca pausado; en la VM de GCP arranca activo (DAGS_PAUSED=false).
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${DAGS_PAUSED:-true}
  AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  # Ahorro de memoria: 1 proceso del webserver (por defecto son 4) y pocas tareas a la vez.
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
  DATA_DIR: /opt/airflow/data
  WIKIS: ${WIKIS:-enwiki,eswiki}
  WIKI_USER_AGENT: ${WIKI_USER_AGENT:-UTEC-BigData-P2/0.1}
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
  CASSANDRA_HOSTS: cassandra
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}

services:
  mongo:
    image: mongo:7.0.14
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      retries: 10
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1.7
    environment:
      # Memoria de Cassandra; ./local.sh la baja en computadoras con poca RAM para Docker.
      MAX_HEAP_SIZE: ${CASSANDRA_HEAP:-512M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEW:-128M}
      CASSANDRA_CLUSTER_NAME: wikipipe
    ports: ["9042:9042"]
    volumes: [cassandra-data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 20s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.2-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Valores bajos por defecto para equipos con ~4 GB para Docker; en la VM de GCP se suben
      # desde el .env (NEO4J_HEAP y NEO4J_PAGECACHE) porque el grafo crece cada hora.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # Prepara la base de metadatos de Airflow y crea el usuario de la interfaz web.
  airflow-init:
    build: {context: ., dockerfile: airflow/Dockerfile}
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname P2 --email admin@example.com || true
    depends_on:
      postgres: {condition: service_healthy}

  # Scheduler, webserver y triggerer en un solo contenedor para ahorrar memoria.
  airflow:
    build: {context: ., dockerfile: airflow/Dockerfile}
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    command: standalone
    ports: ["${AIRFLOW_WEB_PORT:-8080}:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./db:/opt/airflow/db
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: unless-stopped

  # Capa rápida (streaming): lee el stream sin parar y guarda cada evento en ~2 s en MongoDB y en
  # los contadores por minuto de Cassandra. El DAG horario sigue siendo la capa por lotes.
  stream:
    build: {context: ., dockerfile: api/Dockerfile}
    command: ["python", "-m", "wikipipe.streaming"]
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      CASSANDRA_HOSTS: cassandra
      WIKIS: ${WIKIS:-enwiki,eswiki}
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:-UTEC-BigData-P2/0.1}
    volumes:
      - ./src:/app/src
      - ./db:/app/db
    depends_on:
      mongo: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    restart: unless-stopped

  # API del dashboard (FastAPI): lee las tres bases y expone el CRUD. Con DASHBOARD_PASSWORD pide sesión.
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      CASSANDRA_HOSTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      WIKIS: ${WIKIS:-enwiki,eswiki}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    # Solo accesible desde la propia máquina (desarrollo del frontend con `npm run dev`).
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - ./db:/app/db
    depends_on:
      mongo: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: unless-stopped

  # Dashboard (React + shadcn/ui) servido por nginx en el puerto 8501; /api se redirige a la API.
  web:
    build: {context: ./web}
    ports: ["8501:8501"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  mongo-data:
  cassandra-data:
  neo4j-data:
  postgres-data:
