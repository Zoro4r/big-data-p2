server {
  listen 8501;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # DNS interno de Docker: se vuelve a resolver "api" cada 10 s. Sin esto, nginx guarda la IP del
  # arranque y responde 502 cuando el contenedor de la API se reinicia y cambia de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  # API FastAPI (mismo origen: la cookie de sesión funciona sin CORS)
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta del frontend devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
